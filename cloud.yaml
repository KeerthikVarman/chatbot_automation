steps:
  # Step 1: Build Docker container image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Docker Image'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/aiconv-509704/aicon/aiconv:$COMMIT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/aiconv-509704/aicon/aiconv:latest'
      - '.'

  # Step 2: Push container image to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Image with Commit SHA'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/aiconv-509704/aicon/aiconv:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Image with Latest Tag'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/aiconv-509704/aicon/aiconv:latest'

  # Step 3: Deploy container image to Google Cloud Run with Secret Manager Binding
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy to Cloud Run'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'aiconv-service'
      - '--image'
      - 'asia-south1-docker.pkg.dev/aiconv-509704/aicon/aiconv:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--port'
      - '8000'
      - '--allow-unauthenticated'
      - '--set-secrets=OPENROUTER_API_KEY=OPENROUTER_API_KEY:latest'
      - '--set-env-vars=OPENROUTER_MODEL=openai/gpt-oss-20b'

images:
  - 'asia-south1-docker.pkg.dev/aiconv-509704/aicon/aiconv:$COMMIT_SHA'
  - 'asia-south1-docker.pkg.dev/aiconv-509704/aicon/aiconv:latest'

options:
  logging: CLOUD_LOGGING_ONLY
