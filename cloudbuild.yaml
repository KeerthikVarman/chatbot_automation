# ============================================================
# Google Cloud Build CI/CD Pipeline
# GitHub -> Cloud Build -> Pytest -> Artifact Registry -> Cloud Run
# ============================================================

steps:

  # ==========================================================
  # STEP 1: AUTOMATED TESTS
  # ==========================================================
  - name: 'python:3.11-slim'
    id: 'run-tests'
    entrypoint: 'bash'
    secretEnv:
      - 'OPENROUTER_API_KEY'

    args:
      - '-c'
      - |
        set -e

        echo "======================================"
        echo "Installing Dependencies"
        echo "======================================"

        python -m pip install --upgrade pip
        pip install flake8 pytest

        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi

        echo "======================================"
        echo "Running Flake8 Code Inspection"
        echo "======================================"

        flake8 . \
          --count \
          --select=E9,F63,F7,F82 \
          --show-source \
          --statistics

        echo "======================================"
        echo "Running Pytest Test Suite"
        echo "======================================"

        if [ -d tests ]; then
          pytest tests/
        else
          echo "No tests directory found."
        fi

        echo "======================================"
        echo "Tests Completed Successfully"
        echo "======================================"


  # ==========================================================
  # STEP 2: BUILD DOCKER IMAGE
  # ==========================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'

    args:
      - 'build'
      # Image with Cloud Build BUILD_ID
      - '-t'
      - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:$BUILD_ID'
      # latest tag
      - '-t'
      - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:latest'
      # Dockerfile location
      - '-f'
      - 'Dockerfile'
      # Build context
      - '.'


  # ==========================================================
  # STEP 3: PUSH DOCKER IMAGE TO ARTIFACT REGISTRY
  # ==========================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'

    args:
      - 'push'
      - '--all-tags'
      - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}'


  # ==========================================================
  # STEP 4: DEPLOY TO GOOGLE CLOUD RUN
  # ==========================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'

    entrypoint: 'gcloud'

    args:
      - 'run'
      - 'deploy'
      # Cloud Run service name
      - '${_SERVICE_NAME}'
      # Docker image
      - '--image'
      - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:$BUILD_ID'
      # Region
      - '--region'
      - '${_LOCATION}'
      # Managed Cloud Run
      - '--platform'
      - 'managed'
      # Public access
      - '--allow-unauthenticated'
      # Container port
      - '--port'
      - '8000'
      # CPU
      - '--cpu'
      - '2'
      # Memory
      - '--memory'
      - '2Gi'
      # Scaling parameters
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '2'
      # Application environment variables (disabling automatic webhooks/ETL/telemetry)
      - '--set-env-vars'
      - 'OPENROUTER_MODEL=openai/gpt-oss-20b,AUTOMATIC_WEBHOOKS=false,AUTOMATIC_ETL=false,STREAMLIT_BROWSER_GATHER_USAGE_STATS=false,STREAMLIT_SERVER_HEADLESS=true'
      # Secret Manager binding
      - '--set-secrets'
      - 'OPENROUTER_API_KEY=OPENROUTER_API_KEY:latest'


# ============================================================
# ARTIFACT REGISTRY IMAGES
# ============================================================

images:
  - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:$BUILD_ID'
  - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:latest'


# ============================================================
# SUBSTITUTION VARIABLES
# ============================================================

substitutions:
  _LOCATION: 'asia-south1'
  _REPO_NAME: 'aicon'
  _IMAGE_NAME: 'aiconv'
  _SERVICE_NAME: 'aiconv-service'


# ============================================================
# SECRET MANAGER
# ============================================================

availableSecrets:
  secretManager:
    - versionName: 'projects/$PROJECT_ID/secrets/OPENROUTER_API_KEY/versions/latest'
      env: 'OPENROUTER_API_KEY'


# ============================================================
# BUILD OPTIONS
# ============================================================

options:
  logging: 'CLOUD_LOGGING_ONLY'
